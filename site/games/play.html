<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data: https:; style-src 'self' 'unsafe-inline' https: data:; img-src 'self' https: data: blob:; font-src 'self' https: data:; media-src 'self' https: data: blob:; connect-src 'self' https: data: blob:; worker-src 'self' blob: data: https:; frame-src 'self' https: data: blob:; object-src 'none'; base-uri 'self' https:">
<title>~</title>
<style>html,body{margin:0;height:100%;background:#000;color:#8f8f8f;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}body>p{position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:16px;text-align:center;text-transform:lowercase}body>p::before{content:"> ";color:#4a4a4a}#g-wait::after{content:"_";color:#fff;animation:b 1.05s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){#g-wait::after{animation:none}}</style>
<!-- Third-party game code runs here, so this page has the loose CSP and
     nothing else does. It shares this site's origin on purpose so games can
     save progress, which means a game can also read this site's storage. -->
<script>
(function () {
  'use strict';
  // Only used if storage is blocked: give games an in-memory stand-in.
  ['localStorage', 'sessionStorage'].forEach(function (k) {
    try { void window[k].length; return; } catch (e) { /* blocked */ }
    var m = {};
    var s = {
      getItem: function (a) { return Object.prototype.hasOwnProperty.call(m, a) ? m[a] : null; },
      setItem: function (a, v) { m[a] = String(v); },
      removeItem: function (a) { delete m[a]; },
      clear: function () { m = {}; },
      key: function (i) { return Object.keys(m)[i] || null; }
    };
    Object.defineProperty(s, 'length', { get: function () { return Object.keys(m).length; } });
    try { Object.defineProperty(window, k, { value: s, configurable: true }); } catch (e) { /* ignore */ }
  });

  var f = decodeURIComponent(location.hash.slice(1));
  var RAW = 'https://raw.githubusercontent.com/gn-math/html/main/';
  if (!/^[A-Za-z0-9_.-]{1,80}\.html$/.test(f)) { document.write('<p>bad id</p>'); return; }

  // jsDelivr blocks the gn-math user, and GitHub raw is text/plain, so the
  // main server relays GitHub files under /jsgh/ with a real Content-Type.
  function rewrite(html, origin) {
    html = html.replace(/(?:https?:)?\/\/(?:cdn|fastly|gcore|testingcf|quantil)\.jsdelivr\.net\/gh\//gi, origin + '/jsgh/');
    html = html.replace(/(<script\b[^>]*\bsrc=["'])(?:https?:)?\/\/[^"']*\bruffle\b[^"']*(["'])/gi, '$1/vendor/ruffle/ruffle.js$2');
    return html;
  }

  function strip(html) {
    return html
      .replace(/<div\s+id=["']sidebarad[12]["'][^>]*>[\s\S]*?<\/div>\s*(<\/div>)?/g, '')
      .replace(/<script>\s*\(function\(_0x[a-f0-9]+[\s\S]*?duplace\.ne[\s\S]*?<\/script>/g, '')
      .replace(/<script\b[^>]*\bsrc=["'](?:https?:)?\/\/[^"']*(?:googlesyndication|googletagmanager|google-analytics|doubleclick|adsbygoogle)[^"']*["'][^>]*>\s*<\/script>/gi, '');
  }

  fetch('/proxy/config.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(function (cfg) {
      var src = cfg.jsgh ? '/jsgh/gn-math/html@main/' + f : RAW + f;
      return fetch(src).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text().then(function (html) {
          html = strip(html);
          if (cfg.jsgh) html = rewrite(html, location.origin);
          return html;
        });
      });
    }).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      document.body.innerHTML = '<p>could not load this game</p>';
    });
})();
</script>
</head>
<body><p id="g-wait">loading</p></body>
</html>
